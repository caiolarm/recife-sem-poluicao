<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recife sem Poluição</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #1d6f42;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 700px;
      margin: 20px auto;
      padding: 15px;
    }

    .caixa {
      background: white;
      padding: 18px;
      margin-bottom: 18px;
      border-radius: 8px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
    }

    input, select, textarea, button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
    }

    button {
      margin-top: 15px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #1d6f42;
      color: white;
    }

    .registro {
      border: 1px solid #ddd;
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
      background: #fafafa;
    }

    .mensagem {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<header>
  <h1>Recife sem Poluição</h1>
  <p>Registro simples de pontos de poluição</p>
</header>

<main>

  <div class="caixa">
    <h2>Nova denúncia</h2>

    <label>Tipo de poluição</label>
    <select id="tipo">
      <option value="Lixo ou resíduos sólidos">Lixo ou resíduos sólidos</option>
      <option value="Água poluída">Água poluída</option>
      <option value="Esgoto">Esgoto</option>
      <option value="Outro">Outro</option>
    </select>

    <label>Local</label>
    <input id="local" type="text" placeholder="Ex: Iputinga, Recife">

    <label>Descrição</label>
    <textarea id="descricao" placeholder="Descreva o problema encontrado"></textarea>

    <label>Foto (opcional)</label>
    <input id="foto" type="file" accept="image/*">

    <button onclick="enviarDenuncia()">Enviar denúncia</button>

    <div id="mensagem" class="mensagem"></div>
  </div>

  <div class="caixa">
    <h2>Registros</h2>
    <button onclick="mostrarRegistros()">Atualizar registros</button>
    <div id="lista"></div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const urlBanco = "https://nffcouoeoavjmblkvwjp.supabase.co";
const chaveBanco = "sb_publishable_kPR2-mDV6PdC6cgXgaKHlw_l0I7loXU";

const banco = supabase.createClient(urlBanco, chaveBanco);

async function enviarDenuncia() {
 let tipo = document.getElementById("tipo").value;
  let local = document.getElementById("local").value.trim();
 let descricao = document.getElementById("descricao").value.trim();
 let fotoUrl = "";

 if(local == "") {
   document.getElementById("mensagem").innerText = "Digite o local.";
   return;
 }

 if(descricao == "") {
  document.getElementById("mensagem").innerText = "Digite uma descrição.";
  return;
 }

 const { data, error } = await banco
   .from("denuncias")
   .insert([
      {
        tipo: tipo,
        local: local,
        descricao: descricao,
        foto_url: fotoUrl
      }
   ]);

 if(error) {
   console.log(error);
   document.getElementById("mensagem").innerText = "Erro ao salvar a denúncia.";
   return;
 }

 document.getElementById("mensagem").innerText = "Denúncia salva com sucesso!";
 document.getElementById("local").value = "";
 document.getElementById("descricao").value = "";

 mostrarRegistros();
}

async function mostrarRegistros() {
 let lista = document.getElementById("lista");
 lista.innerHTML = "Carregando...";

 const { data, error } = await banco
   .from("denuncias")
   .select("*")
   .order("created_at", { ascending: false });

 if(error) {
   console.log(error);
   lista.innerHTML = "Erro ao carregar os registros.";
   return;
 }

 lista.innerHTML = "";

 if(!data || data.length == 0) {
   lista.innerHTML = "Nenhum registro encontrado.";
   return;
 }

 data.forEach(function(denuncia) {
   let bloco = document.createElement("div");
   bloco.className = "registro";

   let dataTexto = "";
   if(denuncia.created_at) {
      dataTexto = new Date(denuncia.created_at).toLocaleString("pt-BR");
   }

   bloco.innerHTML =
     "<strong>Tipo:</strong> " + (denuncia.tipo || "") + "<br>" +
     "<strong>Local:</strong> " + (denuncia.local || "") + "<br>" +
     "<strong>Descrição:</strong> " + (denuncia.descricao || "") + "<br>" +
     "<strong>Data:</strong> " + dataTexto;

   lista.appendChild(bloco);
 });
}

mostrarRegistros();
</script>

</body>
</html>
